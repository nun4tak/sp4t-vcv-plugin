[workspace]
authors = ["Benoit Bovy"]
channels = ["conda-forge"]
name = "nun4tak-vcv"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
configure = { cmd = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON", description = "Configure the CMake build in build/" }
build = { cmd = "cmake --build build --parallel 4",depends-on = ["configure"], description = "Build the plugin into build/Nun4tak/" }
dist = { cmd = "cmake --build build --parallel 4 --target plugin_dist", depends-on = ["configure"], description = "Package a .vcvplugin into build/dist/" }
install = { cmd = "cmake --install build", depends-on = ["build"], description = "Install the plugin into the Rack user plugin folder" }
clean = { cmd = "cmake -E rm -rf build", description = "Remove the build directory" }

[tasks.compile-commands]
cmd = 'ln -sf build/compile_commands.json compile_commands.json'
depends-on = ["configure"]
description = "Link build/compile_commands.json into the repository root, where language servers look for it"

[tasks.export-panel]
args = ["panel"]
cmd = 'res/staging/export-panel.sh "{{ panel }}"'
description = "Convert one panel's light and dark text to paths and drop its components layer (res/staging/<panel>[-dark].svg -> res/), requires Inkscape"

[dependencies]
cmake = ">=4.3.4,<5"
