[workspace]
authors = ["Benoit Bovy"]
channels = ["conda-forge"]
name = "nun4tak-vcv"
platforms = ["osx-arm64"]
version = "0.1.0"

[tasks]
configure = { cmd = "cmake -S . -B build -DCMAKE_BUILD_TYPE=Release", description = "Configure the CMake build in build/" }
build = { cmd = "cmake --build build --parallel 4",depends-on = ["configure"], description = "Build the plugin into build/Nun4tak/" }
dist = { cmd = "cmake --build build --parallel 4 --target plugin_dist", depends-on = ["configure"], description = "Package a .vcvplugin into build/dist/" }
install = { cmd = "cmake --install build", depends-on = ["build"], description = "Install the plugin into the Rack user plugin folder" }
clean = { cmd = "cmake -E rm -rf build", description = "Remove the build directory" }

[tasks.export-panel]
args = ["panel"]
cmd = '''bash -c 'export FONTCONFIG_FILE="$PWD/res/staging/fonts/fonts.conf"; p="${1%-dark}"; for v in "$p" "$p-dark"; do f="res/staging/$v.svg"; if [ ! -f "$f" ]; then echo "no such panel: $f" >&2; exit 1; fi; inkscape "$f" --export-text-to-path --export-plain-svg --export-overwrite --export-filename="res/$v.svg" || exit 1; done' -- "{{ panel }}"'''
description = "Convert one panel's light and dark text to paths (res/staging/<panel>[-dark].svg -> res/), requires Inkscape"

[dependencies]
cmake = ">=4.3.4,<5"
