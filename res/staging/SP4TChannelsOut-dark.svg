<!-- SP4T Channels Out panel, dark theme. 14 HP. Units: mm.
     Components layer holds VCV Rack placeholders (see
     https://vcvrack.com/manual/Panel#Adding-components); it is
     removed when the production panel is exported. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" version="1.1" width="71.12mm" height="128.5mm" viewBox="0 0 71.12 128.5">
