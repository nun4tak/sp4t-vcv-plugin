  <g id="panel" inkscape:groupmode="layer" inkscape:label="Panel">
    <rect id="background" x="0" y="0" width="71.12" height="128.5" fill="#2a2e35" />
    <!-- just under the top screws -->
    <text id="title" x="35.56" y="9" font-family="'Rounded Mplus 1c', 'Arial Rounded MT Bold', sans-serif" font-size="4.1" font-weight="700" text-anchor="middle" fill="#e6e1cf">SP<tspan fill="#59c2ff" id="title-accent">4</tspan>T · CHANNELS OUT</text>
    <!-- between the bottom screws -->
    <text id="brand" x="35.56" y="125.958" font-family="'Rounded Mplus 1c', 'Arial Rounded MT Bold', sans-serif" font-size="4" font-weight="700" text-anchor="middle" fill="#bfbdb6">\nu.na.tak\</text>
    <!-- Screens (#0d1017): 3D view, layout preset name (LedDisplayChoice),
         channel table (16 rows, 4 per page: channel number, AZ and ELEV
         text fields, LFE toggle). Row states: speaker (AZ / ELEV values,
         LFE "/"), LFE (AZ / ELEV "/", LFE "LFE"), unused (dim number, dim
         dash placeholders). Their content is drawn by the module widget.
         The page LEDs show the current page; all 4 pages are reachable. -->
    <rect id="screen" x="1.728" y="11.5" width="45.6" height="34.039" rx="1.072" fill="#0d1017" />
    <text x="24.528" y="51.6" style="font-weight:600;font-size:3.3px;font-family:'Barlow Condensed', 'Arial Narrow', sans-serif;letter-spacing:0.2;text-anchor:middle;fill:#bfbdb6">LAYOUT</text>
