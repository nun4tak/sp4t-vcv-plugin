    <text id="text150" x="14.848" y="3.728" style="font-weight:bold;font-size:3.321px;font-family:'Rounded Mplus 1c', 'Arial Rounded MT Bold', sans-serif;text-anchor:middle;fill:#e6e1cf;stroke-width:0.81"><tspan sodipodi:role="line" id="tspan153" x="14.848" y="3.728" style="stroke-width:0.81">SP<tspan fill="#59c2ff" id="title-accent">4</tspan>T</tspan></text>
