    <text x="7.486" y="107.4" id="text43" style="font-weight:600;font-size:3.3px;font-family:'Barlow Condensed', 'Arial Narrow', sans-serif;letter-spacing:0.2;text-anchor:middle;fill:#3a4049"><tspan sodipodi:role="line" id="tspan2" x="7.586" y="107.4">AMB</tspan></text>
    <rect style="fill:#bbbfc3;stroke:none" id="rect138" width="17.8" height="19.948" x="20.02" y="101.335" rx="1.433" ry="1.552" />
    <text x="24.443" y="107.4" id="text43-8" style="font-weight:600;font-size:3.3px;font-family:'Barlow Condensed', 'Arial Narrow', sans-serif;letter-spacing:0.2;text-anchor:middle;fill:#3a4049"><tspan sodipodi:role="line" id="tspan157" x="24.543" y="107.4">L</tspan></text>
    <text x="33.272" y="107.4" id="text158" style="font-weight:600;font-size:3.3px;font-family:'Barlow Condensed', 'Arial Narrow', sans-serif;letter-spacing:0.2;text-anchor:middle;fill:#3a4049"><tspan sodipodi:role="line" id="tspan158" x="33.372" y="107.4">R</tspan></text>
  </g>
