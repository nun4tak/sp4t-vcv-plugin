<!-- SP4T XY-MS Out panel, light theme. 8 HP. Units: mm.
     Components layer holds VCV Rack placeholders (see
     https://vcvrack.com/manual/Panel#Adding-components); it is
     removed when the production panel is exported. -->
<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" version="1.1" width="40.64mm" height="128.5mm" viewBox="0 0 40.64 128.5" id="svg8">
  <sodipodi:namedview id="namedview8" inkscape:document-units="mm" />
  <defs id="component-defs">
    <!-- ScrewSilver.svg (VCV Rack Component Library, CC BY-NC 4.0) -->
    <!-- SP4TSwitchTwo_0.svg (top position, i.e. value 0) -->
    <!-- SP4TAmbiPort.svg (PJ301M with the Ayu-blue outer ring) -->
    <!-- PJ301M.svg (VCV Rack Component Library, CC BY-NC 4.0) -->
    <!-- SP4TRoundLargeKnob_bg.svg + SP4TRoundLargeKnob.svg (indicator at the default, centered position) -->
    <!-- SP4TRoundSmallKnob_bg.svg + SP4TRoundSmallKnob.svg (indicator at the default, centered position) -->
  </defs>
  <g id="panel" inkscape:groupmode="layer" inkscape:label="Panel">
    <rect id="background" x="0" y="0" width="40.64" height="128.5" fill="#d8dbdf" />
    <!-- just under the top screws -->
    <text id="title" x="20.32" y="9" style="font-weight:bold;font-size:4.1px;font-family:'Rounded Mplus 1c', 'Arial Rounded MT Bold', sans-serif;text-anchor:middle;fill:#2b3038"><tspan sodipodi:role="line" id="tspan8" x="20.32" y="9">SP<tspan fill="#22a4e6" id="title-accent">4</tspan>T · XY-MS OUT</tspan></text>
    <!-- between the bottom screws -->
    <text id="brand" x="20.32" y="125.958" font-family="'Rounded Mplus 1c', 'Arial Rounded MT Bold', sans-serif" font-size="4" font-weight="700" text-anchor="middle" fill="#3a4049">\nu.na.tak\</text>
    <rect id="screen" x="1.728" y="11.5" width="37.294" height="34.039" rx="0.844" fill="#0d1017" />
    <!-- Microphone pairs, X/Y on the left and M/S on the right, each below the
       half of the screen naming it. A pair is two capsules (circles of radius
       1.665, centres 2.4 apart) drawn as one outline, and two bodies (2.035 x
       7.03 for X/Y, shortened to 5.1289 for M/S so that both pairs reach the
       same depth), each hinged on its capsule centre. A dot marks where the
       module widget puts the LED of the capsule. -->
    <g id="mic-pairs" style="fill:#d8dbdf;stroke:#5c6370;stroke-width:0.25;stroke-linejoin:round">
      <g id="xy-pair">
        <rect id="xy-right-body" x="7.1725" y="50.39" width="2.035" height="7.03" rx="0.8325" transform="rotate(45,8.19,49.65)" />
        <rect id="xy-left-body" x="4.7725" y="50.39" width="2.035" height="7.03" rx="0.8325" transform="rotate(-45,5.79,49.65)" />
        <path id="xy-capsules" d="m 6.99,48.4958 a 1.665,1.665 0 1 0 0,2.3084 a 1.665,1.665 0 1 0 0,-2.3084 z" />
        <circle id="xy-left-dot" cx="5.79" cy="49.65" r="0.666" style="fill:#5c6370;stroke:none" />
        <circle id="xy-right-dot" cx="8.19" cy="49.65" r="0.666" style="fill:#5c6370;stroke:none" />
      </g>
      <g id="ms-pair">
        <rect id="ms-side-body" x="17.4825000000000017053" y="50.39000000000000056843" width="2.03500000000000014211" height="5.12889999999999979252" rx="0.83250000000000001776" transform="rotate(-90,18.5,49.65)" />
        <rect id="ms-mid-body" x="15.082" y="50.39" width="2.035" height="5.129" rx="0.833" />
        <path id="ms-capsules" d="m 17.3,48.4958 a 1.665,1.665 0 1 0 0,2.3084 a 1.665,1.665 0 1 0 0,-2.3084 z" />
        <circle id="ms-mid-dot" cx="16.1" cy="49.65" r="0.666" style="fill:#5c6370;stroke:none" />
        <circle id="ms-side-dot" cx="18.5" cy="49.65" r="0.666" style="fill:#5c6370;stroke:none" />
      </g>
    </g>
    <text x="31.705" y="51.139" id="text118" style="font-weight:600;font-size:2.46944px;font-family:'Barlow Condensed', 'Arial Narrow', sans-serif;text-align:end;letter-spacing:0.2;text-anchor:end;fill:#3a4049"><tspan sodipodi:role="line" id="tspan6" x="31.705" y="51.139">X/Y</tspan></text>
