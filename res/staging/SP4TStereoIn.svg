<?xml version="1.0" encoding="UTF-8"?>
<!-- SP4T Stereo In panel, light theme. 6 HP. Units: mm. -->
<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="30.48mm" height="128.5mm" viewBox="0 0 30.48 128.5">
  <rect id="background" x="0" y="0" width="30.48" height="128.5" fill="#D8DBDF"/>

  <g id="header" font-family="Helvetica, Arial, sans-serif" text-anchor="middle">
    <text id="title" x="15.24" y="9.3" font-size="3" font-weight="bold" fill="#2B3038">SP4T Stereo In</text>
    <text id="subtitle" x="15.24" y="12.4" font-size="1.75" fill="#6B727C">Ambisonic stereo encoder</text>
  </g>

  <!-- Screen area; its content is drawn by the module widget. -->
  <rect id="screen" x="2" y="14.6" width="26.48" height="18.8" rx="0.8" fill="#0D1017"/>

  <g id="labels" font-family="Helvetica, Arial, sans-serif" font-size="1.8" font-weight="bold" text-anchor="middle" fill="#3A4049">
    <!-- knobs at x=10.5, y=44.5 / 60 / 75.5 -->
    <text x="10.5" y="38.3">AZIMUTH</text>
    <text x="10.5" y="53.8">ELEVATION</text>
    <text x="10.5" y="69.3">SPREAD</text>
    <!-- order switch at x=22.5, y=60 -->
    <text x="22.5" y="53.8">ORDER</text>
    <text x="27.1" y="57.65">3</text>
    <text x="27.1" y="60.65">2</text>
    <text x="27.1" y="63.4">1</text>
    <!-- CV inputs at y=97.5 -->
    <text x="5.8" y="91.6">AZI</text>
    <text x="15.24" y="91.6">ELEV</text>
    <text x="24.68" y="91.6">SPREAD</text>
    <!-- audio inputs and Ambisonic output at y=113 -->
    <text x="5.8" y="106.9">L/MONO</text>
    <text x="15.24" y="106.9">R</text>
    <text x="24.68" y="106.9">OUT</text>
  </g>

  <!-- Ambisonic logo contour behind the Ambisonic output jack (radius 5 mm, jack radius 4 mm). -->
  <path id="ambisonic-output-contour" transform="translate(24.68 113)" fill="#FA8D3E" fill-rule="evenodd"
    d="M5,0A5,5 0 1 0 -5,0A5,5 0 1 0 5,0Z
       M0,0A2.5,2.5 0 1 0 -5,0A2.5,2.5 0 1 0 0,0Z
       M5,0A2.5,2.5 0 1 0 0,0A2.5,2.5 0 1 0 5,0Z
       M2.5,-2.5A2.5,2.5 0 1 0 -2.5,-2.5A2.5,2.5 0 1 0 2.5,-2.5Z
       M2.5,2.5A2.5,2.5 0 1 0 -2.5,2.5A2.5,2.5 0 1 0 2.5,2.5Z
       M2.5,0A2.5,2.5 0 1 0 -2.5,0A2.5,2.5 0 1 0 2.5,0Z"/>

  <text id="brand" x="15.24" y="122.2" font-family="Helvetica, Arial, sans-serif" font-size="1.6" text-anchor="middle" fill="#6B727C">\nu.na.tak\</text>
</svg>
