# Builds a distributable .vcvplugin bundle for every platform Rack supports.
#
# The bundles are uploaded as workflow artifacts, and attached to the release
# when the run comes from one. Each is self-contained: a Rack user unzips it
# into their plugin folder, so the only shared libraries a bundle may depend on
# are the ones every machine already has (see the "self-contained" step).
name: Build

on:
  release:
    types: [published]
  # Only the files that decide what is built: the sources themselves are
  # covered by the formatting hook and by building locally.
  push:
    branches: [main]
    paths:
      - Makefile
      - CMakeLists.txt
      - cmake/**
      - pixi.toml
      - pixi.lock
      - plugin.json
      - SDKs/**
      - .gitmodules
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Makefile
      - CMakeLists.txt
      - cmake/**
      - pixi.toml
      - pixi.lock
      - plugin.json
      - SDKs/**
      - .gitmodules
      - .github/workflows/build.yml
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  OPENBLAS_VERSION: "0.3.34" # built from source for Linux, see below

jobs:
  build:
    name: ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write # only used to attach the bundles to a release
    strategy:
      fail-fast: false
      matrix:
        include:
          # Rack publishes an SDK for these four, and no other (there is no
          # lin-arm64 SDK, so no Linux ARM bundle).
          - arch: lin-x64
            runner: ubuntu-22.04 # oldest image available: sets the glibc floor
          - arch: mac-x64
            runner: macos-15-intel
          - arch: mac-arm64
            runner: macos-15
          - arch: win-x64
            runner: windows-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive # SDKs/Spatial_Audio_Framework

      - name: Read the build metadata
        id: meta
        shell: bash
        run: |
          # The SDK version and the plugin slug live in the build files, not here.
          sdk=$(sed -n 's/^set(RACK_SDK_VERSION \([^)]*\))/\1/p' cmake/RackSDK.cmake)
          slug=$(sed -n 's/.*"slug": *"\([^"]*\)".*/\1/p' plugin.json | head -1)
          version=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin.json | head -1)
          test -n "$sdk" && test -n "$slug" && test -n "$version"
          echo "sdk-version=$sdk" >> "$GITHUB_OUTPUT"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # Checked before anything is built, so a mistyped tag fails in seconds.
      - name: Check the release tag against the plugin version
        if: github.event_name == 'release'
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          # The bundles are named after plugin.json, and the Rack library goes
          # by that version too, so a tag that disagrees with it would publish
          # files that do not match the release they hang under.
          if [ "${TAG#v}" != "$VERSION" ]; then
            echo "::error::release tag '$TAG' and the version in plugin.json '$VERSION' disagree"
            exit 1
          fi
          echo "Release $TAG builds $VERSION."

      - name: Cache the Rack SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: SDKs/Rack-SDK
          key: rack-sdk-${{ steps.meta.outputs.sdk-version }}-${{ matrix.arch }}

      - name: Download the Rack SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          curl -fsSL -o Rack-SDK.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${{ steps.meta.outputs.sdk-version }}-${{ matrix.arch }}.zip"
          unzip -q -d SDKs Rack-SDK.zip
          test -f SDKs/Rack-SDK/include/rack.hpp

      # ------------------------------------------------------------ toolchain
      # pixi provides the same CMake the project is developed with. It cannot
      # provide the Windows toolchain: Rack plugins are built with MinGW (see
      # cmake/RackSDK.cmake), which comes from MSYS2 instead.
      - name: Set up pixi
        if: runner.os != 'Windows'
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          cache: true

      # MINGW64 and not the UCRT64 that MSYS2 now recommends: it is the only
      # environment left that targets msvcrt, which is the C runtime Rack and
      # the plugins VCV builds use (its toolchain is crosstool-ng's stock
      # x86_64-w64-mingw32, i.e. mingw-w64's msvcrt default). Rack deletes
      # widgets and modules the plugin allocated, so a plugin built against
      # ucrtbase would be freeing its memory on the wrong heap.
      - name: Set up MSYS2
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          suppress-deprecation-warnings: msystem-mingw64
          update: false
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-openblas

      # Ubuntu's OpenBLAS is compiled with gfortran, and Ubuntu ships no
      # position-independent libgfortran.a, so its Fortran runtime cannot go
      # into a shared object: the link fails on an R_X86_64_TPOFF32 relocation
      # in libgfortran's async.o, which LAPACK reaches through a single symbol
      # (_gfortran_concat_string, used by dgesvd and friends).
      #
      # Building OpenBLAS here drops the Fortran runtime altogether, since
      # NOFORTRAN=1 builds LAPACK from the f2c-translated C sources that ship
      # with it, and pins what lands in the bundle: the CPU baseline Rack
      # targets rather than every kernel OpenBLAS knows, and no threading layer
      # under the audio thread.
      - name: Cache OpenBLAS
        if: runner.os == 'Linux'
        id: openblas-cache
        uses: actions/cache@v6
        with:
          path: openblas
          key: openblas-${{ env.OPENBLAS_VERSION }}-${{ matrix.arch }}-nehalem-nofortran

      - name: Build OpenBLAS
        if: runner.os == 'Linux' && steps.openblas-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o OpenBLAS.tar.gz \
            "https://github.com/OpenMathLib/OpenBLAS/releases/download/v$OPENBLAS_VERSION/OpenBLAS-$OPENBLAS_VERSION.tar.gz"
          mkdir OpenBLAS-src && tar xf OpenBLAS.tar.gz -C OpenBLAS-src --strip-components=1
          # USE_LOCKING, because a single-threaded build still has to be safe
          # to call from Rack's audio and GUI threads.
          flags="NOFORTRAN=1 NO_SHARED=1 NEED_PIC=1 DYNAMIC_ARCH=0 TARGET=NEHALEM USE_THREAD=0 USE_LOCKING=1 USE_OPENMP=0 NO_AFFINITY=1"
          # libs netlib, so that OpenBLAS's own test programs, which the
          # plugin has no use for, are not built.
          make -C OpenBLAS-src -j"$(nproc)" $flags libs netlib
          make -C OpenBLAS-src $flags PREFIX="$PWD/openblas" install
          ls -l openblas/lib/libopenblas.a openblas/include/lapacke.h openblas/include/cblas.h

      # ---------------------------------------------------------------- build
      # SAF needs a BLAS/LAPACK implementation (SAF_PERFORMANCE_LIB):
      # Accelerate on macOS, OpenBLAS elsewhere -- MSYS2's on Windows, the one
      # built above on Linux. Both are either linked statically or part of the
      # system, so the bundle carries no library of its own.
      #
      # SAF_ENABLE_SIMD is off on Linux and Windows on purpose: SAF compiles
      # itself with -march=native there, which would tie the bundle to whatever
      # CPU the runner happens to have. On macOS its SIMD flags are per-arch
      # baselines (nehalem / armv8-a), which every supported machine has.
      - name: Build the bundle (macOS)
        if: runner.os == 'macOS'
        run: |
          pixi run configure \
            -DRACK_SDK_DIR=SDKs/Rack-SDK \
            -DCMAKE_OSX_ARCHITECTURES=${{ matrix.arch == 'mac-arm64' && 'arm64' || 'x86_64' }} \
            -DSAF_PERFORMANCE_LIB=SAF_USE_APPLE_ACCELERATE_LP64
          pixi run dist

      # This OpenBLAS builds LAPACKE in, so there is no separate library.
      - name: Build the bundle (Linux)
        if: runner.os == 'Linux'
        run: |
          pixi run configure \
            -DRACK_SDK_DIR=SDKs/Rack-SDK \
            -DSAF_PERFORMANCE_LIB=SAF_USE_OPEN_BLAS_AND_LAPACKE \
            -DSAF_ENABLE_SIMD=OFF \
            -DOPENBLAS_HEADER_PATH="$PWD/openblas/include" \
            -DLAPACKE_HEADER_PATH="$PWD/openblas/include" \
            -DOPENBLAS_LIBRARY="$PWD/openblas/lib/libopenblas.a;-lm" \
            -DLAPACKE_LIBRARY=
          pixi run dist

      - name: Build the bundle (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          # MSYS2 rewrites arguments that look like paths, which would mangle
          # the ";"-separated library list below.
          export MSYS2_ARG_CONV_EXCL='*'
          openblas_inc=$(cygpath -m /mingw64/include/openblas)
          openblas_lib=$(cygpath -m /mingw64/lib/libopenblas.a)
          ls -l "$(cygpath -u "$openblas_lib")" /mingw64/include/openblas/lapacke.h

          # This OpenBLAS builds LAPACKE in, so there is no separate library.
          # Its Fortran and OpenMP runtimes are linked statically as well,
          # otherwise the plugin would need MSYS2's DLLs at load time.
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DRACK_SDK_DIR=SDKs/Rack-SDK \
            -DSAF_PERFORMANCE_LIB=SAF_USE_OPEN_BLAS_AND_LAPACKE \
            -DSAF_ENABLE_SIMD=OFF \
            -DOPENBLAS_HEADER_PATH="$openblas_inc" \
            -DLAPACKE_HEADER_PATH="$openblas_inc" \
            -DOPENBLAS_LIBRARY="$openblas_lib;-l:libgfortran.a;-l:libgomp.a;-l:libquadmath.a;-l:libwinpthread.a" \
            -DLAPACKE_LIBRARY=
          cmake --build build --parallel --target plugin_dist

      # --------------------------------------------------------------- checks
      - name: Check that the bundle is self-contained
        shell: bash
        run: |
          cd "build/dist/${{ steps.meta.outputs.slug }}"
          case "${{ runner.os }}" in
            Linux)
              ldd plugin.so | tee /tmp/deps.txt
              # libRack is resolved through /tmp/Rack2, which Rack symlinks at
              # startup, so it shows as "not found" here.
              ! grep -qiE 'openblas|lapack|gfortran|quadmath|gomp|stdc\+\+' /tmp/deps.txt
              ;;
            macOS)
              otool -L plugin.dylib | tee /tmp/deps.txt
              ! grep -qiE 'openblas|lapack|gfortran|/opt/homebrew|/usr/local/lib' /tmp/deps.txt
              ;;
            Windows)
              objdump -p plugin.dll | grep 'DLL Name' | tee /tmp/deps.txt
              ! grep -qiE 'openblas|gfortran|quadmath|gomp|winpthread|libstdc|libgcc' /tmp/deps.txt
              ;;
          esac
          echo "No library of its own: the bundle only needs what the system provides."

      - name: Report the bundle size
        shell: bash
        run: |
          du -sh "build/dist/${{ steps.meta.outputs.slug }}" | sed 's/^/unpacked  /'
          ls -lh build/dist/*.vcvplugin | awk '{print "archive   " $5 "  " $9}'

      # ------------------------------------------------------------- delivery
      - name: Upload the bundle
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.slug }}-${{ matrix.arch }}
          path: build/dist/*.vcvplugin
          if-no-files-found: error

      - name: Attach the bundle to the release
        if: github.event_name == 'release'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" build/dist/*.vcvplugin --clobber

  # The VCV Library does not take these bundles: it builds the plugin itself,
  # by cross-compiling through the Makefile (see CLAUDE.md). That path is only
  # exercised here, and only for Windows -- the distribution's own mingw-w64,
  # not VCV's toolchain, so this says "the Makefile cross-compiles", not "the
  # Library's build passes". Rehearse that one locally with
  # VCVRack/rack-plugin-toolchain (v2 branch) before submitting a release.
  library-build:
    name: make dist (cross to win-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Read the build metadata
        id: meta
        run: |
          version=$(sed -n 's/^set(RACK_SDK_VERSION \([^)]*\))/\1/p' cmake/RackSDK.cmake)
          test -n "$version"
          echo "sdk-version=$version" >> "$GITHUB_OUTPUT"

      - name: Install the MinGW cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends mingw-w64

      - name: Cache the Rack SDK
        id: sdk-cache
        uses: actions/cache@v6
        with:
          path: SDKs/Rack-SDK
          key: rack-sdk-${{ steps.meta.outputs.sdk-version }}-win-x64

      - name: Download the Rack SDK
        if: steps.sdk-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o Rack-SDK.zip \
            "https://vcvrack.com/downloads/Rack-SDK-${{ steps.meta.outputs.sdk-version }}-win-x64.zip"
          unzip -q -d SDKs Rack-SDK.zip

      # What `make dep` builds, kept between runs: it is the only slow step.
      - name: Cache the OpenBLAS the Makefile builds
        uses: actions/cache@v6
        with:
          path: dep
          key: makefile-dep-${{ hashFiles('Makefile') }}-win-x64

      # The four targets the Library's toolchain calls, with the variables it
      # sets for a Windows build.
      - name: make dep && make dist
        env:
          RACK_DIR: SDKs/Rack-SDK
          CC: x86_64-w64-mingw32-gcc
          CXX: x86_64-w64-mingw32-g++
          STRIP: x86_64-w64-mingw32-strip
        run: |
          make dep
          make dist
          ls -lh dist/
          test -f dist/*.vcvplugin

      - name: Check that the cross-built plugin is self-contained
        run: |
          x86_64-w64-mingw32-objdump -p dist/*/plugin.dll | grep 'DLL Name' | tee /tmp/deps.txt
          ! grep -qiE 'openblas|gfortran|quadmath|gomp|winpthread|libstdc|libgcc' /tmp/deps.txt
