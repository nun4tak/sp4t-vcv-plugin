# Builds the manual and publishes it to GitHub Pages.
name: Documentation

on:
  push:
    branches: [main]
    paths:
      - doc/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/doc.yml
  pull_request:
    paths:
      - doc/**
      - pixi.toml
      - pixi.lock
      - .github/workflows/doc.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: sphinx-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        # No submodules: SAF is only needed to build the plugin.

      - name: Set up pixi
        uses: prefix-dev/setup-pixi@v0.11.0
        with:
          environments: doc
          cache: true

      - name: Build the manual
        run: pixi run doc-strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: doc/_build/html

  deploy:
    name: github-pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
